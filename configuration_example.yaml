# Example configuration.yaml sections. Merge into your existing sections.
# Device setup is UI-only. Replace every entity ID with your actual entities.
# For automations.yaml, use only the list under "automation".
automation:
  - alias: "Apple TV volume up"
    mode: queued
    trigger:
      - platform: state
        entity_id: event.atv_encoder_cec_command
    condition:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.attributes.get('event_type') == 'volume_up' }}
    action:
      - service: media_player.volume_up
        target:
          entity_id: media_player.living_room_speaker

  - alias: "Apple TV mute"
    mode: queued
    trigger:
      - platform: state
        entity_id: event.atv_encoder_cec_command
    condition:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.attributes.get('event_type') == 'mute' }}
    action:
      - service: media_player.volume_mute
        target:
          entity_id: media_player.living_room_speaker
        data:
          is_volume_muted: true

  - alias: "Meeting room switch to laptop"
    trigger:
      - platform: calendar
        event: start
        entity_id: calendar.meeting_room
    action:
      - service: select.select_option
        target:
          entity_id: select.main_display_rx_stream_source
        data:
          option: "Laptop TX"

  - alias: "Alert on display connection loss"
    trigger:
      - platform: state
        entity_id: binary_sensor.main_display_rx_sink_connected
        from: "on"
        to: "off"
        for: "00:01:00"
    action:
      - service: notify.mobile_app_your_phone
        data:
          title: "AV alert"
          message: "Main display has lost its HDMI connection"

script:
  switch_all_displays_to_camera:
    alias: "Switch all displays to camera"
    sequence:
      - service: select.select_option
        target:
          entity_id:
            - select.main_display_rx_stream_source
            - select.projector_rx_stream_source
        data:
          option: "Camera TX"

  show_av_message:
    alias: "Show AV message"
    sequence:
      - service: number.set_value
        target:
          entity_id: number.main_display_rx_osd_display_duration
        data:
          value: 5
      - service: notify.send_message
        target:
          entity_id: notify.main_display_rx_osd
        data:
          message: "Movie mode enabled"

