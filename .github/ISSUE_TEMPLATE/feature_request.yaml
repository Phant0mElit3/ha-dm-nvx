name: Feature request
description: Suggest a DM NVX capability or Home Assistant improvement.
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like to do?
      description: Describe the workflow and the NVX model involved.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: API reference or sample response
      description: Include a Crestron documentation link or a redacted response if available.
