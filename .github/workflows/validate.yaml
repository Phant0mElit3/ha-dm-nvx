name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (HA ${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            ha: "2024.12.5"
            package: "homeassistant==2024.12.5"
          - python: "3.14"
            ha: "latest"
            package: "homeassistant"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install '${{ matrix.package }}' -r requirements-test.txt
      - name: Lint
        run: ruff check custom_components tests scripts
      - name: Format
        run: ruff format --check custom_components tests scripts
      - name: Test
        run: python -m pytest -q
      - name: Build installable archive
        run: python scripts/build_release.py

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
