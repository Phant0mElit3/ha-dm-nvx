name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v2.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag matches version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -c 'import os, pathlib; assert os.environ["RELEASE_TAG"] == "v" + pathlib.Path("VERSION").read_text().strip()'
      - name: Build archive
        run: python scripts/build_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --verify-tag --title "$RELEASE_TAG" --generate-notes
